<h3>
    Projects
</h3>


<div class="card mb-4">

    <div class="card-body">


        <input class="form-control mb-2" placeholder="Project Name" [(ngModel)]="name">


        <textarea class="form-control mb-2" placeholder="Description" [(ngModel)]="description">
</textarea>



        <!-- <button class="btn btn-primary" (click)="save()">

            Add Project

        </button> -->

        <button class="btn btn-primary" (click)="save()" [disabled]="!name.trim()">

            {{ editMode ? 'Update Project' : 'Add Project' }}

        </button>


        <button *ngIf="editMode" class="btn btn-secondary ms-2" (click)="cancelEdit()">

            Cancel

        </button>


    </div>

</div>




<table class="table table-bordered">


    <tr>

        <th>Name</th>

        <th>Description</th>

        <th></th>

    </tr>


    <tr *ngFor="let p of projects" (click)="openTasks(p.id)" style="cursor:pointer">


        <td>
            {{p.name}}
        </td>


        <td>
            {{p.description}}
        </td>


        <td>

            <button class="btn btn-warning btn-sm me-2" (click)="editProject(p); $event.stopPropagation()">

                Edit

            </button>

            <!-- <button class="btn btn-danger btn-sm" (click)="showDeleteModal(p.id); $event.stopPropagation()">

                Delete

            </button> -->

            <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal"
                (click)="selectedProjectId = p.id; $event.stopPropagation()">
                Delete
            </button>

        </td>


    </tr>


</table>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Delete Project
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Are you sure you want to delete this project?

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">

                    Cancel

                </button>

                <!-- <button class="btn btn-danger" (click)="confirmDelete()">

                    Delete

                </button> -->

                <button class="btn btn-danger" data-bs-dismiss="modal" (click)="confirmDelete()">
                    Delete
                </button>

            </div>

        </div>

    </div>

</div>
